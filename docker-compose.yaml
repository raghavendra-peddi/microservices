services:

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8003:8000"
    env_file:
      - ./auth-service/.env
    depends_on:
      - postgres

  customer-service:
    build:
      context: ./customer-service
    ports:
      - "8000:8000"
    env_file:
      - ./customer-service/.env
    depends_on:
      - postgres

  order-service:
    build:
      context: ./order-service
    ports:
      - "8001:8000"
    env_file:
      - ./order-service/.env  
    depends_on:
      - postgres

  payment-service:
    build:
      context: ./payment-service
    ports:
      - "8002:8000"
    env_file:
      - ./payment-service/.env
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-service
      - order-service
      - payment-service
      - auth-service

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "@Penske@#09871"
      POSTGRES_DB: microservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: