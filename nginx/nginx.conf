events {}

http {
    server {
        listen 80;

        location / {
            default_type text/plain;
            return 200 "Microservices API Gateway is running!";
        }

        location /auth/ {
            rewrite ^/auth(/|$)(.*) /$2 break;
            proxy_pass http://auth-service:8000/; 
        }

        location /customers {
            rewrite ^/customers(/?.*)$ /customers$1 break;
            proxy_pass http://customer-service:8000;
            proxy_set_header Authorization $http_authorization;
        }

        location /orders {
            rewrite ^/orders(/?.*)$ /orders$1 break;
            proxy_pass http://order-service:8000;
            proxy_set_header Authorization $http_authorization;
        }

        location /payments {
            rewrite ^/payments(/?.*)$ /payments$1 break;
            proxy_pass http://payment-service:8000;
            proxy_set_header Authorization $http_authorization;
        }
    }
}