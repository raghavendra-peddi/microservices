events {}

http {
    server {
        listen 80;

        location / {
            default_type text/plain;
            return 200 "Microservices API Gateway is running!";
        }

        location /auth/ {
            rewrite ^/auth(/|$)(.*) /$2 break;
            proxy_pass http://auth-service:8000/; 
        }

        location /customers/docs {
            rewrite ^/customers/(.*) /$1 break;
            proxy_pass http://customer-service:8000;
        }

        location /customers/openapi.json {
            rewrite ^/customers/(.*) /$1 break;
            proxy_pass http://customer-service:8000;
        }

        location /customers {
            if ($http_authorization = "") {
                return 401;
            }
            rewrite ^/customers(/?.*)$ /customers$1 break;
            proxy_pass http://customer-service:8000;
        }

        location /orders/docs {
            rewrite ^/orders/(.*) /$1 break;
            proxy_pass http://order-service:8000;
        }

        location /orders/openapi.json {
            rewrite ^/orders/(.*) /$1 break;
            proxy_pass http://order-service:8000;
        }

        location /orders {
            if ($http_authorization = "") {
                return 401;
            }
            rewrite ^/orders(/?.*)$ /orders$1 break;
            proxy_pass http://order-service:8000;
        }

        location /payments/docs {
            rewrite ^/payments/(.*) /$1 break;
            proxy_pass http://payment-service:8000;
        }

        location /payments/openapi.json {
            rewrite ^/payments/(.*) /$1 break;
            proxy_pass http://payment-service:8000;
        }

        location /payments {
            if ($http_authorization = "") {
                return 401;
            }
            rewrite ^/payments(/?.*)$ /payments$1 break;
            proxy_pass http://payment-service:8000;
        }
    }
}